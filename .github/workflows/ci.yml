name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run nocturne à 2h du matin (UTC) contre la prod, tous navigateurs
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # max-parallel: 1 — les tests tapent sur le VPS de démo ZotoBank partagé
      # (petites ressources) : 3 jobs simultanés dessus ont provoqué des
      # timeouts réseau. On sérialise plutôt que de paralléliser les navigateurs.
      max-parallel: 1
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Installer le navigateur ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Lancer les tests (${{ matrix.browser }})
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Archiver le rapport HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 14
